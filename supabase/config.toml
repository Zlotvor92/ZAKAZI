project_id = "doterajme"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# `enable_signup` ovde NIJE „sme li se registrovati" — Supabase CLI njime pali
# i sam mejl provajder (`GOTRUE_EXTERNAL_EMAIL_ENABLED`). Sa `false` je gasio
# i prijavu postojećih naloga, pa je lokalno `/prijava` vraćalo „Email logins
# are disabled" i sandučić na :54324 nikad ništa nije dobio.
#
# Registraciju zatvara `enable_signup` u sekciji `[auth]` iznad, i ona ostaje
# zatvorena — isto kao u produkciji, gde je `disable_signup: true` uz
# `external_email_enabled: true`.
#
# Raniji `enabled = true` ovde nije postojao kao ključ i CLI ga je ćutke
# ignorisao.
enable_signup = true
enable_confirmations = true
