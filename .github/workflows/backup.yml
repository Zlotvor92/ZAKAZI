name: Backup

# Dve nezavisne kopije, jer kopija kod istog provajdera kod kog je i baza ne
# pomaže kad problem bude sam nalog: privatni GitHub repo i Cloudflare R2.
#
# Ništa se ne šalje u otvorenom obliku. Dump se šifruje `age`-om, javnim
# ključem — CI ume da zaključa, ali ne i da otključa. Privatni ključ nije
# nigde u GitHub-u, pa ni provala u ovaj nalog ne otvara brojeve telefona ni
# beleške o klijentkinjama.

# Ide na sat vremena, ali se ne završava svaki put isto:
#
#   svaki prolaz  → dump, provere, proba vraćanja, šifrovanje, R2
#   01:20 UTC     → uz to i commit u privatni repo
#
# Zašto samo jednom dnevno u git: šifrovan sadržaj je za git slučajan niz —
# ne delta-kodira se i ne kompresuje, pa svaka kopija leži cela. Na sat
# vremena to je 346 MB godišnje već sad, a 8,6 GB kad baza naraste na jedan
# megabajt. Git repo se time ubija; R2 sa rokom trajanja ne.
#
# Proba vraćanja ostaje na svakom prolazu jer traje tri sekunde — slika
# `postgres:17-alpine` je već povučena zbog `pg_dump`-a. Nema razloga da
# ijedna kopija ostane neprovereno ležati.
on:
  # Minut 20 svakog sata. 01:20 UTC je 03:20 po Beogradu leti, 02:20 zimi —
  # tada ide i ona koja se pamti zauvek.
  #
  # GitHub ume da zakasni sa zakazanim poslovima kad je pod opterećenjem, i
  # gasi ih na repou bez ijedne izmene 60 dana. Traka u konzoli na `/admin`
  # zato prijavljuje `stale` posle 26 sati — ona je ta koja to primeti.
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Kopija baze
    runs-on: ubuntu-latest
    # Bez ovoga zaglavljen korak vrti runner do šestočasovnog limita. Ceo
    # posao traje par minuta, pa je sve preko ovoga znak da nešto ne valja.
    timeout-minutes: 15

    env:
      # Javni ključ nije tajna — njime se može samo zaključati. Otključava se
      # isključivo privatnim, koji nije nigde na GitHub-u.
      AGE_PUBLIC_KEY: age1vumv7v3emyr887gg8dr9j9muah2vlk40y25fd5rzgvafm4qyws9qdgnfdt
      BACKUP_REPO: Zlotvor92/zakazi-backup
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Koliko dugo se čuvaju satne kopije. Dnevne se ne diraju — one žive u
      # git istoriji i nemaju rok.
      SATNE_DANA: 14

    steps:
      # Jedan prolaz dnevno nosi i trajnu kopiju; ostali su samo kratkoročni.
      # Ručno pokretanje se uvek računa kao dnevno, da se puna putanja može
      # isprobati bez čekanja na 01:20.
      - name: Koja je ovo kopija
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "$(date -u +%H)" = "01" ]; then
            echo "TRAJNA=da" >> "$GITHUB_ENV"
            echo "BACKUP_FILE=zakazi-$(date -u +%Y-%m-%d).sql.gz.age" >> "$GITHUB_ENV"
            echo "R2_KLJUC=zakazi-$(date -u +%Y-%m-%d).sql.gz.age" >> "$GITHUB_ENV"
            echo "Dnevna kopija — ide i u privatni repo."
          else
            echo "TRAJNA=ne" >> "$GITHUB_ENV"
            echo "BACKUP_FILE=zakazi-$(date -u +%Y-%m-%dT%H).sql.gz.age" >> "$GITHUB_ENV"
            echo "R2_KLJUC=satne/zakazi-$(date -u +%Y-%m-%dT%H).sql.gz.age" >> "$GITHUB_ENV"
            echo "Satna kopija — ide samo na R2, briše se posle $SATNE_DANA dana."
          fi

      # Satna kopija bez R2 nema gde da ode: u git ne sme (vidi zaglavlje), pa
      # bi posao trošio minute i tiho ne radio ništa. Bolje da stane glasno.
      - name: R2 mora biti podešen za satne kopije
        if: env.TRAJNA == 'ne' && env.R2_ACCOUNT_ID == ''
        run: |
          echo '::error::Satne kopije traže R2 (R2_ACCOUNT_ID). Bez njega vrati cron na "20 1 * * *".'
          exit 1

      # Šifrovanje ide statičkim binarnim fajlom umesto preko `apt`-a: prvi
      # pokušaj je dovlačio PGDG repo i posao je visio jedanaest minuta bez
      # ijednog reda ispisa, dok ga nisam prekinuo.
      - name: Alat za šifrovanje
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 \
            https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/age/age /usr/local/bin/age
          age --version

      # `--no-privileges` je ranije stajao uz `--no-owner` i izbacivao SVE
      # `grant` i `revoke` naredbe. Vraćena baza je zbog toga bila mrtva:
      # nijedna funkcija se nije mogla pozvati, jer prava koja migracije
      # pažljivo postavljaju nisu ni bila u fajlu. Vlasništvo se i dalje ne
      # prenosi, jer role novog projekta nisu iste — ali prava se prenose.
      #
      # Runner nosi pg_dump 16, a server je 17.6 — stariji klijent odbija da
      # čita noviji server. Zvanična slika nosi tačno 17 i povlači se sa
      # Docker Hub-a, pa se sistemski paketi ne diraju.
      #
      # Pooler na 6543 radi u transaction režimu, u kom pg_dump ne može da drži
      # konzistentan snimak. Session režim je na 5432, na istom hostu.
      - name: Kopija baze
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm -e PGPASSWORD postgres:17-alpine \
            pg_dump \
              --host=aws-0-eu-central-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.onoaympwuewxoqtkeguz \
              --dbname=postgres \
              --schema=public \
              --schema=auth \
              --no-owner \
              --quote-all-identifiers \
            | gzip -9 > dump.sql.gz
          echo "DUMP_BYTES=$(stat -c%s dump.sql.gz)" >> "$GITHUB_ENV"

      # Prazan ili krnj dump se šifruje jednako lepo kao ispravan, pa bi se
      # tiho slao mesecima. Ovde se gleda pre šifrovanja, dok se još može.
      - name: Provera da kopija nije prazna
        run: |
          set -euo pipefail
          test "$DUMP_BYTES" -gt 10000 || { echo "Kopija je sumnjivo mala: $DUMP_BYTES B"; exit 1; }

          # Raspakuje se u fajl, pa se traži po njemu. Kroz cev ovo ne radi:
          # `grep -q` prestane da čita na prvom pogotku, `gzip` dobije slomljenu
          # cev i vrati grešku, a `pipefail` onda obori red iako je pogodak
          # nađen — provera je padala na ispravnoj kopiji.
          gzip -dc dump.sql.gz > dump.sql

          for t in appointments clients tenants appointment_events; do
            grep -q "CREATE TABLE \"public\".\"$t\"" dump.sql \
              || { echo "U kopiji nema tabele $t"; exit 1; }
          done

          # Poslednji red je prazan ili `--`, sam natpis stoji koji red iznad.
          tail -5 dump.sql | grep -q "PostgreSQL database dump complete" \
            || { echo "Kopija nije zatvorena kako treba — pg_dump je prekinut"; exit 1; }

          echo "Kopija ima $DUMP_BYTES B i sve očekivane tabele."

      # Kopija koja se nikad nije vratila nije kopija nego fajl kome se nadamo.
      # Ovde se diže prazan Postgres iste verzije, kopija se uvozi u njega, i
      # broji se da li je svaki red iz fajla stvarno završio u bazi.
      #
      # Proba ide nad nešifrovanim fajlom, jer CI nema čime da dešifruje — i ne
      # sme da ima. Time se proverava ono što jedino i može da bude pokvareno:
      # da li je sadržaj dumpa pun i da li se uvozi bez gubitka.
      - name: Proba vraćanja
        run: |
          set -euo pipefail

          docker run -d --name proba -e POSTGRES_PASSWORD=proba postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec proba pg_isready -U postgres -q && break
            sleep 2
          done

          # Bez ovoga oba `exclude using gist` ograničenja tiho puknu pri
          # uvozu — `pg_dump` sa `--schema` ne nosi `create extension`. Dump
          # ih sadrži, ali se ne mogu napraviti bez `btree_gist`, pa je
          # vraćena baza ostajala BEZ zaštite od duple rezervacije, a ova
          # proba je svejedno javljala da je sve u redu.
          docker exec proba psql -U postgres -d postgres -q \
            -c 'create extension if not exists btree_gist;'

          # Role koje politike pominju. U pravom odredištu oporavka — novom
          # Supabase projektu — one postoje; u praznom Postgresu ne, pa bi
          # svaka `create policy` pukla i proba bi merila nešto što ni ne liči
          # na stvarno vraćanje.
          for r in anon authenticated service_role supabase_auth_admin supabase_admin \
                   authenticator dashboard_user supabase_storage_admin \
                   supabase_functions_admin supabase_read_only_user; do
            docker exec proba psql -U postgres -d postgres -q \
              -c "do \$\$ begin if not exists (select from pg_roles where rolname='$r')
                  then execute format('create role %I', '$r'); end if; end \$\$;"
          done

          # Vraćanje u prazan Postgres uvek nešto prijavi: dump nosi i `auth`
          # šemu, koja se oslanja na Supabase-ove role i proširenja kojih ovde
          # nema. To se ne prećutkuje nego broji, a presuđuje poređenje redova.
          docker exec -i proba psql -U postgres -d postgres -q -v ON_ERROR_STOP=0 \
            < dump.sql 2> greske.txt || true
          echo "Prijava pri uvozu: $(wc -l < greske.txt) redova."

          # Koliko redova fajl nosi za datu tabelu — broji se blok između
          # `COPY ... FROM stdin;` i završnog `\.`.
          u_fajlu() {
            awk -v t="$1" '
              $0 ~ "^COPY \"public\".\""t"\" " { u=1; next }
              u && $0 == "\\." { u=0 }
              u { n++ }
              END { print n+0 }
            ' dump.sql
          }

          greska=0
          for t in tenants clients appointments appointment_events services working_hours; do
            fajl=$(u_fajlu "$t")
            baza=$(docker exec proba psql -U postgres -d postgres -tAc \
              "select count(*) from public.\"$t\"" 2>/dev/null || echo "NEMA")
            if [ "$fajl" = "$baza" ]; then
              echo "  $t: $baza ✓"
            else
              echo "  $t: u fajlu $fajl, u vraćenoj bazi $baza ✗"
              greska=1
            fi
          done

          # Redovi nisu dovoljni. Kopija koja vrati sve podatke a izgubi
          # ograničenje protiv duple rezervacije izgleda ispravno i nije —
          # baš to se i dešavalo. Zato se broji i ono što čuva podatke, ne
          # samo podaci.
          u_bazi() {
            docker exec proba psql -U postgres -d postgres -tAc "$1" 2>/dev/null || echo 0
          }

          exclude_ogranicenja=$(u_bazi "select count(*) from pg_constraint where contype='x'")
          politike=$(u_bazi "select count(*) from pg_policy")
          rls_tabele=$(u_bazi "select count(*) from pg_class c join pg_namespace n
                               on n.oid=c.relnamespace
                               where n.nspname='public' and c.relkind='r' and c.relrowsecurity")

          echo "  exclude ograničenja: $exclude_ogranicenja (očekivano 2)"
          echo "  RLS politika:        $politike (očekivano najmanje 39)"
          echo "  tabela sa RLS:       $rls_tabele (očekivano najmanje 16)"

          test "$exclude_ogranicenja" -eq 2 || {
            echo "::error::Vraćena baza nema oba ograničenja protiv duple rezervacije."
            greska=1
          }
          test "$politike" -ge 39 || {
            echo "::error::Vraćena baza ima $politike RLS politika umesto najmanje 39."
            greska=1
          }
          test "$rls_tabele" -ge 16 || {
            echo "::error::Vraćena baza ima RLS na $rls_tabele tabela umesto najmanje 16."
            greska=1
          }

          docker rm -f proba > /dev/null
          rm -f dump.sql greske.txt
          test "$greska" -eq 0 || { echo "Vraćanje nije verno — kopija se ne sme smatrati ispravnom."; exit 1; }
          echo "Vraćanje provereno: podaci, ograničenja i politike su svi u bazi."

      - name: Šifrovanje
        run: |
          set -euo pipefail
          age --recipient "$AGE_PUBLIC_KEY" --output "$BACKUP_FILE" dump.sql.gz
          rm -f dump.sql.gz

      # Za dnevnu kopiju je R2 drugo odredište; za satnu je jedino. Dok R2
      # nije podešen, dnevna svejedno ode u privatni repo — satne su iznad već
      # zaustavljene, pa ovde nema tihog gubitka.
      - name: Slanje na Cloudflare R2
        if: env.R2_ACCOUNT_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/$R2_KLJUC" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Otpremljeno: $R2_KLJUC"

      # Rok trajanja se sprovodi ovde, a ne pravilom u Cloudflare konzoli —
      # tako stoji uz posao koji ga pravi i vidi se u istoriji ovog fajla.
      #
      # Datum se čita iz imena, ne iz vremena izmene na R2: ime je ono što
      # posao sam upisuje, pa ne može da se pomeri kad se fajl prekopira.
      # Dnevne kopije nisu u `satne/` i ovo ih ne dodiruje.
      - name: Brisanje satnih kopija starijih od roka
        if: env.R2_ACCOUNT_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          granica=$(date -u -d "$SATNE_DANA days ago" +%Y-%m-%d)
          echo "Brišem satne kopije pre $granica."

          obrisano=0
          # `--recursive` daje pun ključ u poslednjoj koloni; imena su naša i
          # nemaju razmake, pa je ovo bezbedno pročitati.
          for kljuc in $(aws s3 ls "s3://$R2_BUCKET/satne/" --recursive \
                           --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
                         | awk '{print $4}'); do
            datum=$(basename "$kljuc" | sed -n 's/^zakazi-\([0-9-]\{10\}\)T.*/\1/p')
            [ -n "$datum" ] || continue
            if [ "$datum" \< "$granica" ]; then
              aws s3 rm "s3://$R2_BUCKET/$kljuc" \
                --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" > /dev/null
              obrisano=$((obrisano + 1))
            fi
          done
          echo "Obrisano starih satnih kopija: $obrisano."

      # Istorija ovog repoa je usput i verzionisanje: svaki dan stoji kao svoj
      # commit, pa se može uzeti stanje od pre nedelju dana, ne samo poslednje.
      #
      # Samo dnevna kopija. Satne ovde ne ulaze — vidi objašnjenje u zaglavlju.
      - name: Slanje u privatni repo
        if: env.TRAJNA == 'da'
        env:
          GIT_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${GIT_TOKEN}@github.com/$BACKUP_REPO.git" repo
          mkdir -p repo/dnevno
          cp "$BACKUP_FILE" "repo/dnevno/$BACKUP_FILE"
          cd repo
          git config user.name "backup"
          git config user.email "backup@users.noreply.github.com"
          git add "dnevno/$BACKUP_FILE"
          git commit -m "Kopija $BACKUP_FILE" || { echo "Kopija za danas već postoji."; exit 0; }
          git push

      - name: Sažetak
        run: |
          if [ "$TRAJNA" = "da" ]; then
            echo "### Dnevna kopija" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Satna kopija" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- fajl: \`$BACKUP_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- veličina pre šifrovanja: $DUMP_BYTES B" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRAJNA" = "da" ]; then
            if [ -n "$R2_ACCOUNT_ID" ]; then
              echo "- odredišta: privatni repo i Cloudflare R2" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- odredište: privatni repo (R2 još nije podešen)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- odredište: Cloudflare R2, briše se posle $SATNE_DANA dana" >> "$GITHUB_STEP_SUMMARY"
          fi
