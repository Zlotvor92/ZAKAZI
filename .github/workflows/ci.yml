name: CI

on:
  push:
    branches: [main]
  pull_request:

# `push: ["**"]` uz `pull_request` je isti commit slao u dva odvojena kruga, pa
# je svaki PR plaćao sve dvaput. Grana se sada proverava kroz svoj PR, a `push`
# ostaje samo za `main`, gde PR-a nema.
#
# Grupa uz to prekida krug koji je novi push pregazio. Na `main` se pušta do
# kraja: tamo se beleži da je istorija zelena, a ne daje povratna informacija
# na granu koje više nema.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testovi
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Baza
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: Migracije i ograničenja baze
        run: npm run test:db

  e2e:
    name: Kritični tok
    runs-on: ubuntu-latest

    env:
      # Lokalni Supabase uvek ispisuje iste ključeve; ovo nisu tajne.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` sam primeni migracije i pusti seed.
      #
      # Digao bi i ceo ostatak lokalnog steka, a svaka od tih usluga je slika
      # koja se povlači. Testu treba samo put do baze: Kong kao ulaz na 54321,
      # PostgREST za `rpc` pozive, i `gotrue` jer ga middleware dodiruje.
      # Studio, storage, realtime, sandučić za poštu i ostalo javna strana ne
      # otvara nijednom.
      #
      # `-x` ne pokreće kontejnere, ali CLI i dalje povlači slike za realtime
      # i storage da bi napravio njihove šeme u bazi — to je bilo četrdeset
      # sekundi od ukupno osamdeset pet. Tek `enabled = false` to preskače.
      # Menja se samo kopija u CI-ju; lokalno oba ostaju uključena, jer se
      # logo salona čuva u storage-u.
      #
      # Stek se diže u pozadini, dok se paralelno instaliraju paketi i
      # pregledač, a čeka se tek pre testova.
      #
      # Ovo je isključivo lokalni stek za testove; produkcijski Supabase se
      # ovim ne dodiruje, a RLS i površina za neprijavljenog se ionako
      # proveravaju u poslu „Baza", nad čistim Postgresom.
      - name: Podizanje Supabase-a (u pozadini)
        run: |
          printf '\n[realtime]\nenabled = false\n\n[storage]\nenabled = false\n' >> supabase/config.toml
          nohup sh -c 'supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; echo $? > /tmp/supabase-exit' > /tmp/supabase.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      # `--with-deps` je preko `apt`-a instalirao sistemske biblioteke i fontove
      # i na to trošio četiri minuta, dok samo preuzimanje pregledača traje
      # devet sekundi. Slika `ubuntu-latest` već nosi Chrome i Edge, pa su te
      # biblioteke tu — a da nisu, pregledač se ne bi ni pokrenuo i posao bi
      # pao odmah, glasno.
      - name: Keš pregledača
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalacija pregledača
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Čekanje na Supabase
        timeout-minutes: 5
        run: |
          while [ ! -f /tmp/supabase-exit ]; do sleep 1; done
          grep -vE 'Pulling fs layer|Waiting|Verifying Checksum|Download complete|Pull complete|Downloading|Extracting|Already exists' /tmp/supabase.log || true
          exit "$(cat /tmp/supabase-exit)"

      # Servisni ključ je potreban i za sam tok zakazivanja: `public_book`,
      # otkazivanje i pretragu po broju zove samo server.
      - name: Ključevi u okruženje
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      # Ide nad `next build` + `next start` (vidi `playwright.config.ts`), ne nad
      # razvojnim serverom.
      - name: Playwright (Android, produkcioni build)
        run: npm run test:e2e

      # iPhone koristi WebKit. Za sada informativno: ni jednom nije prošao u CI-ju,
      # a ne sme da obara ostale provere zbog sistemskih biblioteka. Kad nekoliko
      # puta zaredom prođe, `continue-on-error` se skida i korak postaje obavezan.
      - name: Playwright (iPhone, WebKit — informativno)
        continue-on-error: true
        env:
          E2E_WEBKIT: "1"
        run: |
          npx playwright install --with-deps webkit
          npx playwright test --project=iphone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Blokira: ranjivost stepena `high` ili višeg u zavisnostima koje idu u
      # produkciju (`--omit=dev`) ne sme da prođe. Produkcija je čista od
      # 8. oktobra 2026, pa prag sme da bude ovde. Preostale ranjivosti u
      # razvojnim zavisnostima su u `docs/security-advisories.md`, sa razlogom.
      - name: Ozbiljne ranjivosti u produkcionim zavisnostima
        run: npm audit --omit=dev --audit-level=high

      # Informativno: cela slika, uključujući razvojne zavisnosti.
      - name: Odakle dolaze ostale ranjivosti
        continue-on-error: true
        run: |
          npm audit || true
          echo "--- lanci zavisnosti ---"
          npm ls postcss || true
          npm ls sharp || true
