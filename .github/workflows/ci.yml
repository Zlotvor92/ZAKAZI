name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testovi
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: npm audit (informativno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Odakle dolaze ranjivosti
        run: |
          npm audit || true
          echo "--- lanci zavisnosti ---"
          npm ls postcss || true
          npm ls sharp || true
