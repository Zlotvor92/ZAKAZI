name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testovi
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Baza
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: Migracije i ograničenja baze
        run: npm run test:db

  audit:
    name: npm audit (informativno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Odakle dolaze ranjivosti
        run: |
          npm audit || true
          echo "--- lanci zavisnosti ---"
          npm ls postcss || true
          npm ls sharp || true
