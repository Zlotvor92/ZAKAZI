name: CI

on:
  push:
    branches: [main]
  pull_request:

# `push: ["**"]` uz `pull_request` je isti commit slao u dva odvojena kruga, pa
# je svaki PR plaćao sve dvaput. Grana se sada proverava kroz svoj PR, a `push`
# ostaje samo za `main`, gde PR-a nema.
#
# Grupa uz to prekida krug koji je novi push pregazio. Na `main` se pušta do
# kraja: tamo se beleži da je istorija zelena, a ne daje povratna informacija
# na granu koje više nema.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testovi
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Baza
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: Migracije i ograničenja baze
        run: npm run test:db

  e2e:
    name: Kritični tok
    runs-on: ubuntu-latest

    env:
      # Lokalni Supabase uvek ispisuje iste ključeve; ovo nisu tajne.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` sam primeni migracije i pusti seed.
      #
      # Digao bi i ceo ostatak lokalnog steka, a svaka od tih usluga je slika
      # koja se povlači. Testu treba samo put do baze: Kong kao ulaz na 54321,
      # PostgREST za `rpc` pozive, i `gotrue` jer ga middleware dodiruje.
      # Studio, storage, realtime, sandučić za poštu i ostalo javna strana ne
      # otvara nijednom.
      #
      # Ovo je isključivo lokalni stek za testove; produkcijski Supabase se
      # ovim ne dodiruje, a RLS i površina za neprijavljenog se ionako
      # proveravaju u poslu „Baza", nad čistim Postgresom.
      - name: Podizanje Supabase-a
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Anon ključ u okruženje
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"

      # `--with-deps` je preko `apt`-a instalirao sistemske biblioteke i fontove
      # i na to trošio četiri minuta, dok samo preuzimanje pregledača traje
      # devet sekundi. Slika `ubuntu-latest` već nosi Chrome i Edge, pa su te
      # biblioteke tu — a da nisu, pregledač se ne bi ni pokrenuo i posao bi
      # pao odmah, glasno.
      - name: Keš pregledača
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalacija pregledača
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: npm audit (informativno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Odakle dolaze ranjivosti
        run: |
          npm audit || true
          echo "--- lanci zavisnosti ---"
          npm ls postcss || true
          npm ls sharp || true
