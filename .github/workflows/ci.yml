name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Provere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testovi
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Baza
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - name: Migracije i ograničenja baze
        run: npm run test:db

  e2e:
    name: Kritični tok
    runs-on: ubuntu-latest

    env:
      # Lokalni Supabase uvek ispisuje iste ključeve; ovo nisu tajne.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalacija (npm ci)
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` sam primeni migracije i pusti seed.
      - name: Podizanje Supabase-a
        run: supabase start

      - name: Anon ključ u okruženje
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"

      - name: Instalacija pregledača
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: npm audit (informativno)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Odakle dolaze ranjivosti
        run: |
          npm audit || true
          echo "--- lanci zavisnosti ---"
          npm ls postcss || true
          npm ls sharp || true
